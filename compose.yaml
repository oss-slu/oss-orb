services:
    api:
        build:
            context: .
            dockerfile: api.Dockerfile
        restart: unless-stopped
        ports: 
            - 8765:8765
        volumes:
            - ./api/data:/api/data:ro
        
    app:
        build:
            context: .
            dockerfile: app.Dockerfile
        restart: unless-stopped
        ports:
            - 8087:80
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./app/index.html:/app/index.html:ro